    <div class="res">
        <h1>Student Registration Form</h1>
        <div class="lines">
            <p>Student Name</p>
            <input type="text" placeholder="Enter Name">
            <p>Email</p>
            <input type="text" placeholder="Enter Email">
            <p>Password</p>
            <input type="password" placeholder="Enter Password">
        </div>
        <br>
        
        <p>Gender</p>
        <input type="radio">
        <label>Male</label>
        <input type="radio" >
        <label>Female</label>
        <br>
        <p>Course</p>
        <select>
            <option select disabled>Select Course</option>
            <option>BSCS</option>
            <option>BSIT</option>
            <option>BSOAD</option>
            <option>BSHM</option>
        </select>
        <br>
        <p>Skills</p>
        <input type="checkbox">
        <label>HTML</label>
        <input type="checkbox">
        <label>CSS</label>
        <input type="checkbox">
        <label>Java Script</label>
        <p>Profile Picture</p>
        <input type="file" src="" alt="Choose File">
        <br>
        <p>Address</p>
        <textarea name="address" id="" cols="30" rows="10" placeholder="Enter Address" class="address"></textarea>

        <div class="btns">   
            <button  type="submit">Submit</button>
            <button  type="reset">Reset</button>
        </div>
    </div>
